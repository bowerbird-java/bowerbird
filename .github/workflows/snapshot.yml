name: Snapshot Deploy

on:
  push:
    branches: [ main ]

permissions:
  packages: write

jobs:

  snapshot:
    name: Deploy Snapshot
    runs-on: ubuntu-latest
    if: github.repository == 'bowerbird-java/bowerbird' && vars.SNAPSHOTS_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Verify snapshot version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ ! "$VERSION" == *-SNAPSHOT ]]; then
            echo "ERROR: Version $VERSION is not a SNAPSHOT. Aborting."
            exit 1
          fi

      - name: Build and deploy snapshot
        run: mvn clean deploy --batch-mode --no-transfer-progress -Psnapshot -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
